# Publica el portafolio (Astro, carpeta frontend/) en GitHub Pages en cada push a main.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el código, escribir en Pages y firmar el despliegue.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega otro push, el que está en curso termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar, compilar y empaquetar el sitio
        uses: withastro/action@v3
        with:
          path: ./frontend
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
